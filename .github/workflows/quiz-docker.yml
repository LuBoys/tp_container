name: Vérifier le quiz Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier-quiz:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Construire l'image sécurisée
        run: |
          docker build --pull \
            -f dockerfile-exercice2/Dockerfile.secure \
            -t quiz-docker:ci \
            dockerfile-exercice2

      - name: Vérifier le quiz
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name quiz-ci \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --memory 128m --cpus 0.5 --pids-limit 100 \
            -p 127.0.0.1:8092:8080 \
            quiz-docker:ci
          trap 'docker rm -f quiz-ci >/dev/null 2>&1 || true' EXIT

          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 1 --max-time 5 \
            http://127.0.0.1:8092/ -o /tmp/quiz-ci.html
          grep -Fq '<title>Quiz App</title>' /tmp/quiz-ci.html
          asset=$(grep -oE '/assets/[^"]+\.js' /tmp/quiz-ci.html | head -n 1)
          curl --fail --silent --show-error \
            "http://127.0.0.1:8092$asset" -o /dev/null
          echo "La page et son fichier JavaScript répondent."
